# Роздача PMTiles для MapLibre: файл читається запитами Range, тому потрібні
# CORS і заголовки Range / Content-Range.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/tiles;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers Range always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, ETag' always;
        add_header Cache-Control 'public, max-age=3600' always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }
}
